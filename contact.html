<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系 · 纳微矩阵</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <header>
        <div class="container nav-wrapper">
            <div class="logo">◈ 纳微矩阵 <span>v2.0</span></div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="equipment.html">设备</a>
                <a href="computing.html">计算引擎</a>
                <a href="about.html">关于</a>
                <a href="contact.html" class="active">联系</a>
            </div>
            <a href="contact.html" class="nav-cta">预约测试</a>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">▍ 联系我们</h2>
            <div class="section-sub"><span>预约设备、咨询方案或技术合作</span></div>

            <div class="contact-grid">
                <div class="contact-info">
                    <h3>📌 联系方式</h3>
                    <div class="contact-item">
                        <span class="icon">📞</span>
                        <div class="text"><strong>电话</strong><br>暂无</div>
                    </div>
                    <div class="contact-item">
                        <span class="icon">✉️</span>
                        <div class="text"><strong>邮箱</strong><br>暂无</div>
                    </div>
                    <div class="contact-item">
                        <span class="icon">📍</span>
                        <div class="text"><strong>地址</strong><br>北京</div>
                    </div>
                    <div class="contact-item">
                        <span class="icon">🕒</span>
                        <div class="text"><strong>工作时间</strong><br>周一至周五 9:00 – 18:00 (GMT+8)</div>
                    </div>
                    <div class="map-placeholder">🗺️ 地图位置（示例）<br><span style="font-size:12px;">实际集成可使用高德/百度地图 iframe</span></div>
                </div>

                <div class="contact-form">
                    <h3>📝 在线留言</h3>
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">姓名 *</label>
                            <input type="text" id="name" placeholder="例如：张伟" required>
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱 *</label>
                            <input type="email" id="email" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="message">消息 *</label>
                            <textarea id="message" placeholder="请描述您的测试需求或合作意向…" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%;">发送消息</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="container">
        <div>© 2026 纳微矩阵 · 高端表征与计算平台</div>
        <div>
            <a href="#">隐私条款</a> · <a href="#">技术协议</a> · <a href="mailto:info@nanomatrix.tech">联系工程师</a>
        </div>
    </footer>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
